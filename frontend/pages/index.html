<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultify - Home</title>
    <link rel="icon" type="image/svg+xml" href="../images/main-logo.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tag-colors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../js/config.js"></script>
    <script src="../js/api-client.js"></script>
    <script src="../js/cultify-data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/slider.js"></script>
    <script src="../js/minimal.js"></script>
</head>

<body>
    <header id="app-header"></header>
    <div class="container">
        <section id="hero-slider-section" class="mb-2"></section>
        <div class="index-controls mb-2">
            <div class="filter-bar">
                <button class="filter-btn" data-category="Movie">Movies</button>
                <button class="filter-btn" data-category="Series">Series</button>
                <button class="filter-btn" data-category="Game">Games</button>
                <button class="filter-btn" data-category="Book">Books</button>
            </div>
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="content-search" class="search-input" placeholder="Search movies, games, books...">
            </div>
        </div>
        <div id="content-grid" class="grid">
            <!-- Rendered by JS -->
        </div>

        <section id="community-reviews-section" style="display:none;">
            <h2 class="mb-1">Community Reviews</h2>
            <div id="reviews-grid" class="reviews-grid">
                <!-- Rendered by JS -->
            </div>
            <div class="text-center mt-2" id="load-more-reviews-wrap" style="display:none;">
                <button id="load-more-reviews-btn" class="btn btn-primary"
                    style="border-radius: 50%; width: 40px; height: 40px; padding: 0; font-size: 1.5rem; line-height: 1;">+</button>
            </div>
        </section>
    </div>
</body>

</html>
