<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultify - Login</title>
    <link rel="icon" type="image/svg+xml" href="../images/main-logo.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tag-colors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../js/config.js"></script>
    <script src="../js/api-client.js"></script>
    <script src="../js/cultify-data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/minimal.js"></script>
</head>

<body>
    <header id="app-header"></header>
    <div class="container" style="max-width: 400px; margin-top: 5rem;">
        <h1 class="text-center mb-1">Login</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" required style="padding-right: 40px;">
                    <i class="fa-regular fa-eye" id="togglePassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-secondary); opacity: 0.7; transition: opacity 0.2s; z-index: 10;"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
        </form>
        <p class="text-center mt-2" style="margin-top: 1rem;">
            Don't have an account? <a href="register.html">Register</a>
        </p>
    </div>
</body>

</html>
