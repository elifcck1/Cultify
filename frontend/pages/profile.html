<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultify - Profile</title>
    <link rel="icon" type="image/svg+xml" href="../images/main-logo.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tag-colors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../js/config.js"></script>
    <script src="../js/api-client.js"></script>
    <script src="../js/cultify-data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/profile.js"></script>
    <script src="../js/minimal.js"></script>
</head>

<body>
    <header id="app-header"></header>
    <div id="profile-container" class="container">
        <!-- Rendered by JS -->
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <button id="close-edit-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-fname">First Name</label>
                    <input type="text" id="edit-fname" class="form-control" maxlength="15">
                </div>
                <div class="form-group">
                    <label for="edit-lname">Last Name</label>
                    <input type="text" id="edit-lname" class="form-control" maxlength="15">
                </div>
                <div class="form-group">
                    <label for="edit-bio">About Me</label>
                    <textarea id="edit-bio" class="form-control" rows="4" maxlength="255"></textarea>
                </div>
                <div class="form-group">
                    <label>Choose Avatar</label>
                    <div class="avatar-selector">
                        <div class="avatar-option" data-icon="fa-solid fa-user"><i class="fa-solid fa-user"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-user-astronaut"><i class="fa-solid fa-user-astronaut"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-user-ninja"><i class="fa-solid fa-user-ninja"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-user-secret"><i class="fa-solid fa-user-secret"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-user-graduate"><i class="fa-solid fa-user-graduate"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-ghost"><i class="fa-solid fa-ghost"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-user-shield"><i class="fa-solid fa-user-shield"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-robot"><i class="fa-solid fa-robot"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-dragon"><i class="fa-solid fa-dragon"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-cat"><i class="fa-solid fa-cat"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-brain"><i class="fa-solid fa-brain"></i></div>
                        <div class="avatar-option" data-icon="fa-solid fa-mask"><i class="fa-solid fa-mask"></i></div>
                    </div>
                </div>
                <div class="modal-actions" style="display: flex; justify-content: space-between;">
                    <button id="delete-account-btn" class="btn btn-danger" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 0.5rem 1rem; font-size: 0.9rem;">Delete Account 🗑️</button>
                    <button id="save-profile-btn" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
